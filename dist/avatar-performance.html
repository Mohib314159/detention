<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detention · Warden performance study</title><style>*{box-sizing:border-box}body{margin:0;background:#17201b;color:#eee7d9;font:14px system-ui}#world{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}header,footer{position:fixed;left:20px;right:20px;padding:16px 20px;background:#132018e8;border:1px solid #ffffff25;border-radius:10px}header{top:16px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}footer{bottom:16px;max-width:600px;margin:auto;text-align:center}a{color:#d7e8b5}button,select{padding:12px;margin:4px;background:#d5dfbc;color:#142016;border:0;border-radius:5px;font:inherit}p{margin:8px 0;color:#bdcbb9;font-size:12px}#impact{position:fixed;pointer-events:none;border:2px solid #eee2c2;border-radius:50%;width:70px;height:70px;transform:translate(-50%,-50%);opacity:0}#impact.hit{animation:contact .3s ease-out}@keyframes contact{from{opacity:.8;scale:.7}to{opacity:0;scale:1.5}}@media(prefers-reduced-motion:reduce){#impact.hit{animation:none}}</style></head><body><div id="world"></div><header><a href="./avatar-lab.html">← Facial workshop</a><b>WARDEN · FULL-BODY EXPERIMENT</b><a href="./?build=17">Back to class</a></header><div id="impact"></div><footer><div id="status" role="status">Loading the experimental rig…</div><button id="calm" disabled>Look away · calm</button><button id="rage" disabled>Stare · approach & rage</button><select id="arena" aria-label="Arena"><option value="gym">After-hours gym</option><option value="classroom">Detention hall</option><option value="rooftop">Midnight rooftop</option></select><p>Authored boxing motion + expressive MakeHuman head. Experimental neck fit and skin matching; this does not replace your saved instructor.</p></footer><script type="module">
import {createClassroom} from './scene.js?v=17';
try{const room=await createClassroom(document.querySelector('#world'),{experimentalHuman:true});room.setCostume('fighter');room.setBackground('gym');room.setReduced(matchMedia('(prefers-reduced-motion: reduce)').matches);document.querySelector('#status').textContent='Ready. Compare calm, approach and punching.';for(const b of document.querySelectorAll('button'))b.disabled=false;document.querySelector('#calm').onclick=()=>room.setSuspicion(0);document.querySelector('#rage').onclick=()=>room.setSuspicion(100);document.querySelector('#arena').onchange=e=>room.setBackground(e.target.value);room.setSoundHandler((kind,p)=>{if(kind!=='bang')return;const el=document.querySelector('#impact');el.style.left=(p.x*100)+'%';el.style.top=(p.y*100)+'%';el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');});}catch(e){console.error(e);document.querySelector('#status').textContent='The experimental avatar could not load. Return to class or refresh to retry.';}
</script></body></html>
