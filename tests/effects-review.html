<!doctype html><html><head><base href="/dist/"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#17211d;color:white;font:16px system-ui}#room{height:90vh}nav{position:absolute;bottom:12px;display:flex;gap:8px;padding:12px}button{padding:14px;border-radius:12px;border:0}</style></head><body><div id="room"></div><nav><button disabled id="pie">Pie</button><button disabled id="water">Water</button><button disabled id="bucket">Bucket</button></nav><output style="position:absolute;top:0;background:black" id="state"></output><script type="module">import {createClassroom} from '../dist/scene.js?v=23';let speed=1;const room=await createClassroom(document.querySelector('#room'),{timeScale:()=>speed});await room.setCostume('fighter');for(const type of ['pie','water','bucket']){document.getElementById(type).disabled=false;document.getElementById(type).onclick=()=>{speed=1;room.revenge(type);setTimeout(()=>speed=0,900);}};setInterval(()=>document.querySelector('#state').textContent=JSON.stringify(room.getState()),100);</script></body></html>
